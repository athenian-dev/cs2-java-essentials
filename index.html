<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Tells a phone to use its own width instead of pretending to be a
       desktop screen and shrinking everything down. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scavenger Hunt</title>
  <style>
    /* Keep the line breaks and runs of spaces exactly as typed in
       questions.js, in the question, the answers and the message alike */
    #questionArea, #answerArea, #messageArea { white-space: pre-wrap; }
    /* Put each answer on its own line */
    label { display: block; }
    /* A blank line between the question and the answers, and another
       between the answers and the Submit button */
    #answerArea { margin: 1em 0; }
    /* Long lines of pasted code get a sideways scrollbar instead of
       stretching the page */
    pre { overflow-x: auto; }

    /* Everything below only applies on a narrow screen, meaning a phone.
       A computer screen is left exactly as it was. */
    @media (max-width: 700px) {
      body { font-size: 24px; margin: 12px; }
      /* Room around each answer so a finger can hit it */
      label { padding: 10px 0; }
      /* Bigger circles to match the bigger text */
      input[type="radio"] { width: 22px; height: 22px; vertical-align: middle; }
      /* A Submit button big enough to tap */
      #submitButton { font-size: 24px; padding: 14px 28px; }
      /* Slightly smaller code, so more of each line fits on the screen */
      pre { font-size: 17px; }
    }
  </style>
</head>
<body>

<!-- These four spots on the page start out empty.
     The code at the bottom fills them in. -->
<div id="questionArea"></div>
<div id="answerArea"></div>
<button id="submitButton">Submit</button>
<p id="messageArea"></p>

<!-- Load your questions. This gives us QUESTIONS and LOCKOUT_SECONDS. -->
<script src="questions.js"></script>

<script>
// Grab the four spots above so we can put text into them later.
var questionArea = document.getElementById('questionArea')
var answerArea = document.getElementById('answerArea')
var submitButton = document.getElementById('submitButton')
var messageArea = document.getElementById('messageArea')

// These three must match the numbers at the top of build.py.
var VERSION = 1
var SALT_BYTES = 16
var TAG_BYTES = 16


// ---------------------------------------------------------------------------
// STEP 1: Cut the questions file into one chunk of text per question.
//         A line of --- means "start a new question here".
// ---------------------------------------------------------------------------
function splitIntoQuestions(text) {
  var chunks = [[]]

  text.split('\n').forEach(function (line) {
    if (line.trim().startsWith('---')) {
      chunks.push([])                            // start a new question
    } else {
      chunks[chunks.length - 1].push(line)       // add to the current one
    }
  })

  return chunks
}


// ---------------------------------------------------------------------------
// STEP 2: Read each chunk and sort its lines into name, question text,
//         answers, and the "you got it right" message.
// ---------------------------------------------------------------------------
function readQuestion(lines) {
  var question = {
    name: '',                    // set by a "# name" line
    text: [],                    // every line without a marker
    answers: [],                 // set by "- wrong" and "* correct" lines
    correctMessage: 'Correct!',  // replaced by a "> message" line
    hiddenMessage: null          // set by a "!" line: see STEP 3
  }

  // A line of ~~~ starts a block of code, and another one ends it. Inside a
  // code block nothing is treated as a marker, so pasted code is left alone.
  var insideCodeBlock = false

  lines.forEach(function (line) {
    var marker = line.trim().charAt(0)          // the first character
    var rest = line.trim().substring(1).trim()  // everything after it

    if (line.trim() === '~~~') {
      insideCodeBlock = !insideCodeBlock
      question.text.push(line)
    } else if (insideCodeBlock) {
      question.text.push(line)                  // a line of code: keep it as is
    } else if (marker === '#') {
      question.name = rest.toLowerCase()
    } else if (marker === '*') {
      question.answers.push({ text: rest, isCorrect: true })
    } else if (marker === '-') {
      question.answers.push({ text: rest, isCorrect: false })
    } else if (marker === '>') {
      question.correctMessage = rest
    } else if (marker === '!') {
      question.hiddenMessage = rest
    } else {
      question.text.push(line)                  // an ordinary question line
    }
  })

  // Glue the question's own lines back together into one piece of text.
  question.text = question.text.join('\n').trim()
  return question
}


// ---------------------------------------------------------------------------
// STEP 3: Unscrambling, for a questions.js that has been locked.
//
//         A locked file has nothing readable in it. Each question is one
//         "!q" line of jumble, and there are two locks on the way in:
//
//           the outer lock   A question is scrambled with a key built from
//                            its own name, the number on its QR code. The
//                            only name this page has is the one in the web
//                            address, so index.html#612 can open the one
//                            question at that spot and no others.
//
//           the inner lock   Inside a question no answer is marked correct.
//                            The message is scrambled again with a key built
//                            from the text of the correct answer, so this
//                            page checks an answer by building that key out
//                            of whatever was picked and seeing if it fits.
//                            Nothing here knows the answer until then.
//
//         The recipe below is the same one build.py follows. A key is
//         stretched slowly out of a secret, and gives us a "tag" that
//         recognises the right key, and a "keystream" of unguessable bytes
//         that the text was XORed with. XOR twice with the same bytes and
//         you are back to the original text, which is how unscrambling works.
// ---------------------------------------------------------------------------
function toBytes(text) {
  return new TextEncoder().encode(text)
}

function fromBase64(text) {
  var characters = atob(text)
  var bytes = new Uint8Array(characters.length)
  for (var i = 0; i < characters.length; i++) bytes[i] = characters.charCodeAt(i)
  return bytes
}

// Stretch a secret into a key. This is deliberately slow: it is the same
// work repeated 100000 times, which nobody notices once but which makes
// guessing at secrets a chore.
async function deriveKey(secret, salt, iterations) {
  var seed = await crypto.subtle.importKey('raw', toBytes(secret), 'PBKDF2',
                                           false, ['deriveBits'])
  var recipe = { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' }
  return new Uint8Array(await crypto.subtle.deriveBits(recipe, seed, 256))
}

async function mixWithKey(key, text) {
  var asKey = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' },
                                            false, ['sign'])
  return new Uint8Array(await crypto.subtle.sign('HMAC', asKey, toBytes(text)))
}

async function checkTag(key) {
  return (await mixWithKey(key, 'check')).subarray(0, TAG_BYTES)
}

async function keystream(key, length) {
  var stream = new Uint8Array(length)
  var filled = 0
  var counter = 0

  while (filled < length) {
    var piece = await mixWithKey(key, 'ks' + counter)
    var take = Math.min(piece.length, length - filled)
    stream.set(piece.subarray(0, take), filled)
    filled += take
    counter++
  }

  return stream
}

// Try a key on some scrambled bytes. Gives back the text if the key fits,
// and null if it does not, which is how a wrong answer is spotted.
async function unseal(key, sealed) {
  var tag = await checkTag(key)

  for (var i = 0; i < TAG_BYTES; i++) {
    if (tag[i] !== sealed[i]) return null
  }

  var body = sealed.subarray(TAG_BYTES)
  var stream = await keystream(key, body.length)
  var plain = new Uint8Array(body.length)
  for (var i = 0; i < body.length; i++) plain[i] = body[i] ^ stream[i]

  return new TextDecoder().decode(plain)
}

// A "!" line carries the version and the number of repetitions it was made
// with, then its salt, then the scrambled message.
function readHiddenMessage(line) {
  var raw = fromBase64(line)

  return {
    version: raw[0],
    iterations: (raw[1] * 16777216) + (raw[2] * 65536) + (raw[3] * 256) + raw[4],
    salt: raw.subarray(5, 5 + SALT_BYTES),
    sealed: raw.subarray(5 + SALT_BYTES)
  }
}

function isLocked(text) {
  return text.split('\n').some(function (line) { return line.trim().startsWith('!lock ') })
}


// ---------------------------------------------------------------------------
// STEP 4: Work out which question this web address is asking for.
//         The part after the # is the request, so index.html#612 asks for
//         the question named 612. Only a name works: there is no counting
//         down the list, so nobody can walk through the hunt by trying
//         #1, #2, #3. In a locked file the name is also the key, so a name
//         nobody has scanned yet opens nothing at all.
// ---------------------------------------------------------------------------
var request = decodeURIComponent(window.location.hash.replace('#', '')).trim().toLowerCase()

// A plain, unlocked questions.js: read every question and match the name.
function findInPlainFile(text, request) {
  var found = null

  splitIntoQuestions(text).forEach(function (lines) {
    var question = readQuestion(lines)
    if (question.answers.length > 0 && question.name !== '' && question.name === request) {
      found = question
    }
  })

  return found
}

// A locked questions.js: stretch the name into a key and try it on each
// question in turn. Exactly one of them opens, unless the name is wrong.
async function findInLockedFile(text, request) {
  var header = null
  var sealedQuestions = []

  text.split('\n').forEach(function (line) {
    var trimmed = line.trim()
    if (trimmed.startsWith('!lock ')) {
      header = trimmed.split(/\s+/)
    } else if (trimmed.startsWith('!q ')) {
      sealedQuestions.push(fromBase64(trimmed.substring(3).trim()))
    }
  })

  if (header === null || Number(header[1]) !== VERSION) return null

  var key = await deriveKey(request, fromBase64(header[3]), Number(header[2]))

  for (var i = 0; i < sealedQuestions.length; i++) {
    var opened = await unseal(key, sealedQuestions[i])
    if (opened !== null) return readQuestion(opened.split('\n'))
  }

  return null
}


// ---------------------------------------------------------------------------
// STEP 5: Turn your text into something the page can show.
//         Blocks of code between ~~~ lines are shown exactly as pasted.
//         In ordinary text, **this** becomes bold and ~this~ becomes code.
// ---------------------------------------------------------------------------

// Make every character harmless, so a < or & you typed shows up on the page
// exactly as you typed it instead of being read as part of the page.
function makeSafe(text) {
  return text
    .split('&').join('&amp;')
    .split('<').join('&lt;')
    .split('>').join('&gt;')
}

function formatText(text) {
  var result = ''

  // Cut the text at every ~~~ line. The pieces then alternate: ordinary text,
  // code block, ordinary text, code block... so every second piece is code.
  var pieces = text.split(/^[ \t]*~~~[ \t]*$/m)

  pieces.forEach(function (piece, position) {
    var isCodeBlock = position % 2 === 1

    if (isCodeBlock) {
      // Nothing inside a code block is treated as a mark: it is shown as is.
      // Only the blank lines left behind by the ~~~ lines are removed, so the
      // indenting of the code itself is untouched.
      result += '<pre>' + makeSafe(piece.replace(/^\n+/, '').replace(/\n+$/, '')) + '</pre>'
    } else {
      var ordinary = makeSafe(piece)
      // **like this** becomes bold, ~like this~ becomes code. [\s\S] stands
      // for "any character at all, line breaks included", so a pair of marks
      // can wrap around several lines.
      ordinary = ordinary.replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>')
      ordinary = ordinary.replace(/~([\s\S]+?)~/g, '<code>$1</code>')
      result += ordinary
    }
  })

  return result
}


// ---------------------------------------------------------------------------
// STEP 6: Put the question on the page.
// ---------------------------------------------------------------------------
function showQuestion(question) {
  questionArea.innerHTML = formatText(question.text)

  question.answers.forEach(function (answer, position) {
    // A "label" makes the answer text clickable, not just the little circle.
    var row = document.createElement('label')
    var circle = document.createElement('input')
    var words = document.createElement('span')

    circle.type = 'radio'
    circle.name = 'answer'      // same name for all of them = only one can be picked
    circle.value = position     // remembers which answer this circle belongs to
    words.innerHTML = ' ' + formatText(answer.text)

    row.appendChild(circle)
    row.appendChild(words)
    answerArea.appendChild(row)
  })
}


// ---------------------------------------------------------------------------
// STEP 7: The lockout after a wrong answer.
//         The time the lockout ends is saved in the browser's own storage,
//         so refreshing the page cannot skip the wait.
// ---------------------------------------------------------------------------
function updateLockout() {
  var endTime = Number(localStorage.getItem('lockoutEndsAt'))
  var millisecondsLeft = endTime - Date.now()

  if (millisecondsLeft > 0) {
    // Still locked: grey out the button and show the countdown.
    submitButton.disabled = true
    messageArea.textContent = 'Nope — wait ' + Math.ceil(millisecondsLeft / 1000) + 's'
    setTimeout(updateLockout, 100)   // check again in a tenth of a second
  } else {
    // Time is up: let them try again.
    submitButton.disabled = false
    if (endTime > 0) {
      localStorage.removeItem('lockoutEndsAt')
      messageArea.textContent = ''
    }
  }
}

function wrongAnswer() {
  // Save the moment the lockout ends, then start the countdown.
  localStorage.setItem('lockoutEndsAt', Date.now() + LOCKOUT_SECONDS * 1000)
  updateLockout()
}


// ---------------------------------------------------------------------------
// STEP 8: What happens when Submit is clicked.
//
//         In a plain file the correct answer is marked, so this is a glance
//         at that mark. In a locked file nothing is marked: the answer that
//         was picked is stretched into a key, and if that key opens the
//         hidden message then it was the right answer. Stretching a key
//         takes a moment, so the button is greyed out while it happens.
// ---------------------------------------------------------------------------
async function checkAnswer(question) {
  var picked = document.querySelector('input[name="answer"]:checked')

  if (!picked) {
    messageArea.textContent = 'Pick an answer'
    return
  }

  var answer = question.answers[picked.value]

  if (question.hiddenMessage === null) {
    // A plain questions.js, the way it reads while you are editing it.
    if (answer.isCorrect) {
      messageArea.innerHTML = formatText(question.correctMessage)
    } else {
      wrongAnswer()
    }
    return
  }

  submitButton.disabled = true
  messageArea.textContent = 'Checking…'

  var hidden = readHiddenMessage(question.hiddenMessage)
  var key = await deriveKey(question.name + '\n' + answer.text, hidden.salt, hidden.iterations)
  var opened = await unseal(key, hidden.sealed)

  if (opened === null) {
    wrongAnswer()                       // the key did not fit: wrong answer
  } else {
    submitButton.disabled = false
    // What was hidden is the whole "> message" line, so drop the > itself.
    messageArea.innerHTML = formatText(opened.trim().substring(1).trim())
  }
}


// ---------------------------------------------------------------------------
// STEP 9: Start everything off.
// ---------------------------------------------------------------------------
async function start() {
  var question = null

  if (!isLocked(QUESTIONS)) {
    question = findInPlainFile(QUESTIONS, request)
  } else if (!window.crypto || !window.crypto.subtle) {
    // Unscrambling needs the browser's own crypto, which it only hands out
    // over https (and on localhost). Opening the file straight off a disk
    // in some browsers lands here.
    questionArea.textContent = 'Open this page over https and it will work.'
    submitButton.remove()
    return
  } else if (request !== '') {
    questionArea.textContent = 'Unlocking…'
    question = await findInLockedFile(QUESTIONS, request)
    questionArea.textContent = ''
  }

  if (question) {
    showQuestion(question)
    submitButton.onclick = function () { checkAnswer(question) }
    updateLockout()        // in case a lockout was still running before a refresh
  } else {
    // No question was asked for, or no question answers to that name.
    questionArea.textContent = 'Scavenger Hunt'
    submitButton.remove()
  }
}

start()

// If the address changes (someone scans a different code), load that question.
window.onhashchange = function () { window.location.reload() }
</script>

</body>
</html>
